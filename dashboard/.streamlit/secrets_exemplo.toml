# Copie para "secrets.toml" (NAO vai para o GitHub) e preencha.
# No Streamlit Community Cloud, cole este mesmo conteudo em Settings > Secrets.

[firebase]
database_url = "https://SEU-PROJETO-default-rtdb.firebaseio.com"

# Conteudo do JSON da conta de servico (Firebase > Configuracoes > Contas de servico)
[firebase.conta_servico]
type = "service_account"
project_id = "SEU-PROJETO"
private_key_id = "..."
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = "firebase-adminsdk-xxxxx@SEU-PROJETO.iam.gserviceaccount.com"
client_id = "..."
token_uri = "https://oauth2.googleapis.com/token"

# Usuarios do dashboard (so entra quem estiver aqui). Gere cada linha com:
#     python dashboard/gerar_senha.py
# Perfis: "admin" (ve tudo e altera Cadastros) ou "leitura" (so consulta).
[usuarios]
rodrigo = { perfil = "admin", senha = "pbkdf2_sha256$200000$<sal>$<hash>" }
